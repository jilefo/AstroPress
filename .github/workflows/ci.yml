name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (67 packages)
        run: pnpm run typecheck

      - name: Build (Node standalone)
        run: pnpm run build

      - name: Build (Cloudflare Workers)
        run: pnpm run build:cf

      - name: Syntax check (deploy scripts)
        run: python -m py_compile "Deploy_AstroPress_Cloudflare_v12.3.py" "部署AstroPress到Cloudflare.py"
